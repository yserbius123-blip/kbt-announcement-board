<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Board Administration</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
		<link rel="stylesheet" type="text/css" href="css/admin.css">
	</head>
	<body>

		<header class="admin-topbar">
			<div class="admin-topbar-inner">
				<div class="admin-brand">
					<span class="admin-title">Board Administration</span>
					<span id="save-status" class="save-status" role="status" aria-live="polite"></span>
				</div>
				<div class="admin-actions">
					<button type="button" class="btn btn-outline-brass" data-bs-toggle="modal" data-bs-target="#passwordModal">
						Change Password
					</button>
					<button type="button" id="save-btn" class="btn btn-brass btn-save">Save</button>
				</div>
			</div>
		</header>

		<main class="admin-main">

			<div id="load-error" class="alert alert-warning d-none" role="alert"></div>

			<ul class="nav nav-tabs admin-tabs" id="sectionTabs" role="tablist">
				<li class="nav-item" role="presentation">
					<button
						class="nav-link active"
						id="tab-west-btn"
						data-bs-toggle="tab"
						data-bs-target="#tab-west"
						type="button"
						role="tab"
						aria-controls="tab-west"
						aria-selected="true">
						Weekday Schedule
					</button>
				</li>
				<li class="nav-item" role="presentation">
					<button
						class="nav-link"
						id="tab-center-btn"
						data-bs-toggle="tab"
						data-bs-target="#tab-center"
						type="button"
						role="tab"
						aria-controls="tab-center"
						aria-selected="false">
						Announcements
					</button>
				</li>
				<li class="nav-item" role="presentation">
					<button
						class="nav-link"
						id="tab-east-btn"
						data-bs-toggle="tab"
						data-bs-target="#tab-east"
						type="button"
						role="tab"
						aria-controls="tab-east"
						aria-selected="false">
						Shabbos Times
					</button>
				</li>
			</ul>

			<div class="tab-content admin-tab-content" id="sectionTabsContent">
				<div class="tab-pane fade show active" id="tab-west" role="tabpanel" aria-labelledby="tab-west-btn">
					<div class="pages-list" data-section="west">
						<div id="page-template">
							<div class="page-card">
								<div class="page-card-header">
									<span class="page-label">One</span>
									<div class="page-card-controls">
										<button type="button" class="icon-btn move-page-up" title="Move page earlier">&uarr;</button>
										<button type="button" class="icon-btn move-page-down" title="Move page later">&darr;</button>
										<button type="button" class="icon-btn danger remove-page" title="Remove page">&times;</button>
									</div>
								</div>
								<div class="items-list">
									<div id="item-announcement-template">
										<div class="item-row" data-item-type="announcement">
											<div class="item-row-main">
												<span class="item-type-badge badge-announcement">Announcement</span>
												<input type="text" class="form-control form-control-sm item-title" placeholder="Title (e.g. Mazal Tov)" value="Mazal Tov!">
												<textarea class="form-control form-control-sm item-text" rows="2" placeholder="Announcement text">To the Mishpochos</textarea>
											</div>
											<div class="item-row-controls">
												<button type="button" class="icon-btn move-item-up" title="Move up">&uarr;</button>
												<button type="button" class="icon-btn move-item-down" title="Move down">&darr;</button>
												<button type="button" class="icon-btn danger remove-item" title="Remove item">&times;</button>
											</div>
										</div>
									</div>

									<div id="item-scheduled-template">
										<div class="item-row" data-item-type="scheduled">
											<div class="item-row-main">
												<span class="item-type-badge badge-scheduled">Scheduled</span>
												<input type="text" class="form-control form-control-sm item-title" placeholder="Title (e.g. Shacharis)" value="Mincha">
												<input type="text" class="form-control form-control-sm item-time" value="7:45pm">
											</div>
											<div class="item-row-controls">
												<button type="button" class="icon-btn move-item-up" title="Move up">&uarr;</button>
												<button type="button" class="icon-btn move-item-down" title="Move down">&darr;</button>
												<button type="button" class="icon-btn danger remove-item" title="Remove item">&times;</button>
											</div>
										</div>
									</div>

								</div>
								<div class="page-card-footer">
									<button type="button" class="btn btn-sm btn-outline-secondary add-announcement-item">+ Announcement</button>
									<button type="button" class="btn btn-sm btn-outline-secondary add-scheduled-item">+ Scheduled Item</button>
								</div>
							</div>
						</div>
						<div id="page-template">
							<div class="page-card">
								<div class="page-card-header">
									<span class="page-label">Two</span>
									<div class="page-card-controls">
										<button type="button" class="icon-btn move-page-up" title="Move page earlier">&uarr;</button>
										<button type="button" class="icon-btn move-page-down" title="Move page later">&darr;</button>
										<button type="button" class="icon-btn danger remove-page" title="Remove page">&times;</button>
									</div>
								</div>
								<div class="items-list">
									
								</div>
								<div class="page-card-footer">
									<button type="button" class="btn btn-sm btn-outline-secondary add-announcement-item">+ Announcement</button>
									<button type="button" class="btn btn-sm btn-outline-secondary add-scheduled-item">+ Scheduled Item</button>
								</div>
							</div>
						</div>
					</div>
					<button type="button" class="btn btn-outline-brass btn-add-page" data-section="west">+ Add Page</button>
				</div>
				<div class="tab-pane fade" id="tab-center" role="tabpanel" aria-labelledby="tab-center-btn">
					<div class="pages-list" data-section="center"></div>
					<button type="button" class="btn btn-outline-brass btn-add-page" data-section="center">+ Add Page</button>
				</div>
				<div class="tab-pane fade" id="tab-east" role="tabpanel" aria-labelledby="tab-east-btn">
					<div class="pages-list" data-section="east"></div>
					<button type="button" class="btn btn-outline-brass btn-add-page" data-section="east">+ Add Page</button>
				</div>
			</div>

		</main>

		<!-- ===== Templates (cloned by admin.js) ===== -->

		<template id="page-template">
			<div class="page-card">
				<div class="page-card-header">
					<span class="page-label"></span>
					<div class="page-card-controls">
						<button type="button" class="icon-btn move-page-up" title="Move page earlier">&uarr;</button>
						<button type="button" class="icon-btn move-page-down" title="Move page later">&darr;</button>
						<button type="button" class="icon-btn danger remove-page" title="Remove page">&times;</button>
					</div>
				</div>
				<div class="items-list"></div>
				<div class="page-card-footer">
					<button type="button" class="btn btn-sm btn-outline-secondary add-announcement-item">+ Announcement</button>
					<button type="button" class="btn btn-sm btn-outline-secondary add-scheduled-item">+ Scheduled Item</button>
				</div>
			</div>
		</template>

		<template id="item-announcement-template">
			<div class="item-row" data-item-type="announcement">
				<div class="item-row-main">
					<span class="item-type-badge badge-announcement">Announcement</span>
					<input type="text" class="form-control form-control-sm item-title" placeholder="Title (e.g. Mazal Tov)">
					<textarea class="form-control form-control-sm item-text" rows="2" placeholder="Announcement text"></textarea>
				</div>
				<div class="item-row-controls">
					<button type="button" class="icon-btn move-item-up" title="Move up">&uarr;</button>
					<button type="button" class="icon-btn move-item-down" title="Move down">&darr;</button>
					<button type="button" class="icon-btn danger remove-item" title="Remove item">&times;</button>
				</div>
			</div>
		</template>

		<template id="item-scheduled-template">
			<div class="item-row" data-item-type="scheduled">
				<div class="item-row-main">
					<span class="item-type-badge badge-scheduled">Scheduled</span>
					<input type="text" class="form-control form-control-sm item-title" placeholder="Title (e.g. Shacharis)">
					<input type="time" class="form-control form-control-sm item-time">
				</div>
				<div class="item-row-controls">
					<button type="button" class="icon-btn move-item-up" title="Move up">&uarr;</button>
					<button type="button" class="icon-btn move-item-down" title="Move down">&darr;</button>
					<button type="button" class="icon-btn danger remove-item" title="Remove item">&times;</button>
				</div>
			</div>
		</template>

		<!-- ===== Change Password modal ===== -->
		<div class="modal fade" id="passwordModal" tabindex="-1" aria-labelledby="passwordModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<form id="password-form" novalidate>
						<div class="modal-header">
							<h5 class="modal-title" id="passwordModalLabel">Change Password</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<div id="password-error" class="alert alert-danger d-none" role="alert"></div>
							<div id="password-success" class="alert alert-success d-none" role="alert"></div>
							<div class="mb-3">
								<label for="current-password" class="form-label">Current Password</label>
								<input type="password" class="form-control" id="current-password" autocomplete="current-password" required>
							</div>
							<div class="mb-3">
								<label for="new-password" class="form-label">New Password</label>
								<input type="password" class="form-control" id="new-password" autocomplete="new-password" minlength="8" required>
							</div>
							<div class="mb-3">
								<label for="confirm-password" class="form-label">Confirm New Password</label>
								<input type="password" class="form-control" id="confirm-password" autocomplete="new-password" minlength="8" required>
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
							<button type="submit" class="btn btn-brass">Update Password</button>
						</div>
					</form>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="js/admin.js"></script>
	</body>
</html>
