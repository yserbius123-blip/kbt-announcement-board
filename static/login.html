<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
		<meta name="viewport" content="width=1920, height=1080">
<title>Login</title>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
 
<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="card-title mb-3 text-center">Sign In</h4>
 
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
 
            <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>
 
            <button type="submit" class="btn btn-primary w-100">Submit</button>
          </form>
 
        </div>
      </div>
    </div>
  </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = e.target;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('loginError');
    errorBox.classList.add('d-none');
 
    if (!password) {
      form.classList.add('was-validated');
      return;
    }
 
    try {
      const formData = new URLSearchParams();

      formData.append("username", "admin");
      formData.append("password", password);
      const response = await fetch('/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData
      });
 
      if (response.ok) {
        redirectAfterLogin();
      } else {
        errorBox.textContent = 'Incorrect password. Please try again.';
        errorBox.classList.remove('d-none');
      }
    } catch (err) {
      errorBox.textContent = 'Something went wrong. Please try again.';
      errorBox.classList.remove('d-none');
    }
  });
 
  function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    const target = params.get('redirected_from');
 
    // Only redirect to a same-site relative path (starts with a single "/",
    // not "//"), to avoid an open-redirect to an external/attacker URL.
    if (target && /^\/(?!\/)/.test(target)) {
      window.location.href = target;
    } else {
      window.location.href = '/';
    }
  }
</script>
 
</body>
</html>
